[workspace]
resolver = "2"
members = [
    "crates/rb_domain",
    "crates/rb_replay_ingest",
    "crates/rb_capture_ingest",
    "crates/rb_verify_cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/baileyrd/rusty_bullet"
publish = false

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
